spring:
  application:
    name: qr-bot
  data:
    mongodb:
      database: ${MONGODB_DATABASE:qr_bot}
      auto-index-creation: true
analytics:
  enabled: true
  collection: analytics_events
  retention: 31d
qr:
  links:
    public-base-url: ${QR_PUBLIC_BASE_URL:https://qr.twob.cc}
telegram:
  startup-notifier:
    enabled: ${TELEGRAM_STARTUP_NOTIFIER_ENABLED:true}
  token: ${TELEGRAM_BOT_TOKEN}
  bot-username: ${TELEGRAM_BOT_USERNAME}
  content-channel-id: ${TELEGRAM_CONTENT_CHANNEL_ID}
  restart-notification-chat-id: ${TELEGRAM_RESTART_NOTIFICATION_CHAT_ID:0}
  polling:
    enabled: false
  webhook:
    enabled: true
    path: /telegram/webhook
    secret: ${TELEGRAM_WEBHOOK_SECRET}
logging:
  file:
    name: ${QR_BOT_LOG_FILE:/var/log/qr-bot/application.json}
  structured:
    format:
      file: logstash
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz
      max-file-size: 20MB
      max-history: 35
      clean-history-on-start: true
  level:
    ua.mytnyk.qrbot: ${QR_BOT_LOG_LEVEL:INFO}
