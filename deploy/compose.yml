name: qr-bot-prod

services:
  mongodb:
    container_name: qr-bot-prod-mongodb
    image: mongo:8.0
    restart: unless-stopped
    init: true
    command:
      - mongod
      - --auth
      - --bind_ip_all
      - --wiredTigerCacheSizeGB=0.25
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      MONGO_APP_DATABASE: qr_bot
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?Set MONGO_APP_USERNAME in .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}
    volumes:
      - mongodb-data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/10-create-app-user.js:ro
    ports:
      # Loopback-only: remote access must go through an authenticated SSH tunnel.
      - "127.0.0.1:27018:27017"
    networks:
      - mongodb-network
      - mongodb-loopback-network
    mem_limit: 768m
    pids_limit: 200
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"quit(db.adminCommand('ping').ok ? 0 : 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    container_name: qr-bot-prod-app
    image: qr-bot-prod-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:?Set TELEGRAM_BOT_USERNAME in .env}
      TELEGRAM_CONTENT_CHANNEL_ID: ${TELEGRAM_CONTENT_CHANNEL_ID:?Set TELEGRAM_CONTENT_CHANNEL_ID in .env}
      TELEGRAM_RESTART_NOTIFICATION_CHAT_ID: ${TELEGRAM_RESTART_NOTIFICATION_CHAT_ID:-0}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?Set TELEGRAM_WEBHOOK_SECRET in .env}
      SPRING_DATA_MONGODB_HOST: qr-bot-prod-mongodb
      SPRING_DATA_MONGODB_PORT: "27017"
      SPRING_DATA_MONGODB_DATABASE: qr_bot
      SPRING_DATA_MONGODB_USERNAME: ${MONGO_APP_USERNAME:?Set MONGO_APP_USERNAME in .env}
      SPRING_DATA_MONGODB_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}
      SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE: qr_bot
      QR_BOT_LOG_LEVEL: ${QR_BOT_LOG_LEVEL:-INFO}
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=70
        -XX:+ExitOnOutOfMemoryError
        -Djava.io.tmpdir=/tmp
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - application-logs:/var/log/qr-bot
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - mongodb-network
      - outbound-network
    mem_limit: 640m
    pids_limit: 150
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  mongodb-data:
    name: qr-bot-prod-mongodb-data
  application-logs:
    name: qr-bot-prod-application-logs

networks:
  mongodb-network:
    name: qr-bot-prod-mongodb-network
    internal: true
  mongodb-loopback-network:
    name: qr-bot-prod-mongodb-loopback-network
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  outbound-network:
    name: qr-bot-prod-outbound-network
