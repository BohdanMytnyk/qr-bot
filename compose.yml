services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
  bot:
    build:
      context: ..
      dockerfile: qr-bot/Dockerfile
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      TELEGRAM_CONTENT_CHANNEL_ID: ${TELEGRAM_CONTENT_CHANNEL_ID}
      TELEGRAM_RESTART_NOTIFICATION_CHAT_ID: ${TELEGRAM_RESTART_NOTIFICATION_CHAT_ID:-0}
      MONGODB_URI: mongodb://mongo:27017/qr_bot
      QR_BOT_LOG_LEVEL: ${QR_BOT_LOG_LEVEL:-INFO}
    depends_on:
      mongo:
        condition: service_healthy
volumes:
  mongo-data:
